name: AI-nieuws verversen

# Elke ochtend vanaf 07:00 Nederlandse tijd.
# GitHub start geplande runs soms uren te laat of slaat er een over. Daarom draait hij elk uur
# van 05:00 tot 14:00 UTC, en ververst hij alleen als het nieuws van vandaag er nog niet is.
on:
  schedule:
    - cron: "0 5-14 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: ai-nieuws
  cancel-in-progress: false

jobs:
  verversen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Is het nieuws van vandaag er al?
        id: tijd
        run: |
          uur=$(TZ=Europe/Amsterdam date +%H); vandaag=$(TZ=Europe/Amsterdam date +%Y-%m-%d)
          laatst=$(python3 -c "import json,datetime,zoneinfo;d=json.load(open('ai-nieuws/ai-nieuws.json'));print(datetime.datetime.fromisoformat(d['bijgewerkt']).astimezone(zoneinfo.ZoneInfo('Europe/Amsterdam')).date())" 2>/dev/null || echo geen)
          echo "Nederlandse tijd: $(TZ=Europe/Amsterdam date), laatst ververst: $laatst"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || { [ "$uur" -ge 7 ] && [ "$laatst" != "$vandaag" ]; }; then echo "door=ja" >> "$GITHUB_OUTPUT"; else echo "door=nee" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-python@v5
        if: steps.tijd.outputs.door == 'ja'
        with:
          python-version: "3.12"

      - name: Nieuws ophalen
        if: steps.tijd.outputs.door == 'ja'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optioneel: zonder sleutel draait alleen het filter
        run: python tools/ai_nieuws.py ai-nieuws/ai-nieuws.json

      - name: Opslaan en publiceren
        if: steps.tijd.outputs.door == 'ja'
        run: |
          git config user.name "AI-nieuws bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai-nieuws/ai-nieuws.json
          if git diff --cached --quiet; then echo "Geen nieuw nieuws"; exit 0; fi
          git commit -m "AI-nieuws $(TZ=Europe/Amsterdam date +%Y-%m-%d)"
          git push   # de push zet GitHub Pages automatisch opnieuw live
